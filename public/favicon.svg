<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="THP Dash">
  <defs>
    <!-- 20deg press to accent -->
    <linearGradient id="base" x1="0.28" y1="1.10" x2="0.72" y2="-0.10">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#4c8dff"/>
    </linearGradient>
    <!-- 225deg humid to transparent 50% -->
    <linearGradient id="humid" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3db8f0" stop-opacity="1"/>
      <stop offset="0.5" stop-color="#3db8f0" stop-opacity="0"/>
      <stop offset="1" stop-color="#3db8f0" stop-opacity="0"/>
    </linearGradient>
    <!-- 145deg temp to transparent 55% -->
    <linearGradient id="temp" x1="0.10" y1="-0.07" x2="0.90" y2="1.07">
      <stop offset="0" stop-color="#f0b429" stop-opacity="1"/>
      <stop offset="0.55" stop-color="#f0b429" stop-opacity="0"/>
      <stop offset="1" stop-color="#f0b429" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="chip">
      <rect width="64" height="64" rx="15"/>
    </clipPath>
  </defs>

  <!-- .brand-mark: 34px / radius 8px → 64 / rx 15 -->
  <g clip-path="url(#chip)">
    <rect width="64" height="64" fill="url(#base)"/>
    <rect width="64" height="64" fill="url(#humid)"/>
    <rect width="64" height="64" fill="url(#temp)"/>
  </g>
  <!-- border 1px solid line color -->
  <rect x="0.5" y="0.5" width="63" height="63" rx="14.5" fill="none" stroke="#243044" stroke-width="1"/>
</svg>
